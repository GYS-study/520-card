<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>520整蛊页面</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#ffeef5;
  font-family:
  "PingFang SC",
  "Microsoft YaHei",
  sans-serif;

  overflow-x:hidden;
}

.container{
  width:100%;
  max-width:480px;
  margin:auto;
  min-height:100vh;

  padding:20px;
  position:relative;
}

/* ===== 背景圆点 ===== */

.circle{
  position:absolute;
  border-radius:50%;
  background:#ffc7dd;
  opacity:.7;
  z-index:0;
}

.c1{
  width:80px;
  height:80px;
  top:40px;
  left:20px;
}

.c2{
  width:120px;
  height:120px;
  top:80px;
  right:10px;
}

.c3{
  width:90px;
  height:90px;
  bottom:150px;
  left:30px;
}

.c4{
  width:70px;
  height:70px;
  bottom:260px;
  right:20px;
}

.main{
  position:relative;
  z-index:2;
  text-align:center;
}

/* ===== 图片 ===== */

.hero-img{
  width:260px;
  margin:30px auto 20px;
}

.hero-img img{
  width:100%;
  border-radius:20px;

  box-shadow:
  0 10px 30px rgba(0,0,0,.15);

  animation:shake 2s infinite;
}

/* 魔性抖动 */

@keyframes shake{

  0%{
    transform:rotate(0deg);
  }

  20%{
    transform:rotate(2deg);
  }

  40%{
    transform:rotate(-2deg);
  }

  60%{
    transform:rotate(2deg);
  }

  80%{
    transform:rotate(-2deg);
  }

  100%{
    transform:rotate(0deg);
  }

}

/* ===== 标题 ===== */

.title{
  font-size:52px;
  color:#ff3f7f;
  font-weight:bold;

  margin-top:10px;
}

/* ===== 文本框 ===== */

.sub-box{

  margin-top:30px;

  background:#fff;

  border:4px solid #ff5d96;

  border-radius:30px;

  padding:28px;

  font-size:24px;

  line-height:1.6;

  box-shadow:
  0 10px 20px rgba(0,0,0,.05);
}

/* ===== 提示 ===== */

.tip{
  margin-top:30px;
  color:#ff3f7f;
  font-size:22px;
  font-weight:bold;
}

/* ===== 输入区 ===== */

.input-wrap{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.input-wrap input{

  flex:1;

  height:60px;

  border-radius:16px;

  border:2px solid #ff7ca7;

  padding:0 20px;

  font-size:20px;

  outline:none;
}

.btn{

  width:120px;

  border:none;

  border-radius:16px;

  background:
  linear-gradient(
  135deg,
  #ff4b87,
  #ff6ea9
  );

  color:#fff;

  font-size:22px;

  font-weight:bold;

  cursor:pointer;

  transition:.2s;
}

.btn:active{
  transform:scale(.95);
}

/* ===== 结果区 ===== */

.result{

  margin-top:30px;

  background:#fff;

  border-radius:24px;

  padding:30px;

  min-height:120px;

  display:none;

  font-size:24px;

  line-height:1.8;

  animation:show .3s ease;

  box-shadow:
  0 10px 20px rgba(0,0,0,.08);
}

@keyframes show{

  from{
    transform:scale(.8);
    opacity:0;
  }

  to{
    transform:scale(1);
    opacity:1;
  }

}

/* ===== 底部 ===== */

.footer{

  margin-top:40px;

  color:#999;

  font-size:14px;

  text-align:center;

  padding-bottom:30px;
}

</style>
</head>

<body>

<div class="container">

  <!-- 背景 -->

  <div class="circle c1"></div>
  <div class="circle c2"></div>
  <div class="circle c3"></div>
  <div class="circle c4"></div>

  <div class="main">

    <!-- 图片 -->

    <div class="hero-img">

      <!-- 这里换成你的图片名字 -->

      <img src="haha.png">

    </div>

    <!-- 标题 -->

    <div class="title">
      520快乐？
    </div>

    <!-- 恶搞文案 -->

    <div class="sub-box">

      瞅啥呢，单身狗，520有人陪你吗

    </div>

    <!-- 提示 -->

    <div class="tip">

      ❤️ 输入520领取你今天的一日对象 ❤️

    </div>

    <!-- 输入 -->

    <div class="input-wrap">

      <input
      type="text"
      id="code"
      placeholder="请输入520"
      />

      <button
      class="btn"
      onclick="startPrank()">

      领取

      </button>

    </div>

    <!-- 结果 -->

    <div
    class="result"
    id="resultBox"></div>

    <!-- 底部 -->

    <div class="footer">

      友情提示：
      本页面仅供娱乐整蛊 😈

    </div>

  </div>

</div>

<script>

function startPrank(){

  let val =

  let box =

  if(val !== "520"){

  let texts = [

    "💘 系统正在匹配对象...<br><br>匹配失败，因为你长得像朋友圈仅三天可见",

    "🐶 今日对象已上线：<br><br>你家的WiFi路由器",

    "📢 检测到你单身指数过高<br><br>系统自动赠送纸巾一包",

    "🤣 领取成功！<br><br>你的520对象：美团外卖骑手",

    "💔 对不起<br><br>附近50km暂无眼瞎用户",

    "😎 AI恋爱系统检测中...<br><br>系统建议你先减肥再恋爱",

    "🎁 恭喜获得神秘女友一位！<br><br>加载失败：余额不足",

    "📡 正在搜索对象...<br><br>搜索结果：查无此人",

    "🐸 你今日的专属对象：<br><br>QQ自动回复机器人",

    "💡 温馨提示：<br><br>520不是属于你的节日<br><br>是商家的KPI",

    "🧸 系统随机赠送对象：<br><br>床上的大熊玩偶",

    "📢 警告：<br><br>你已连续单身超过系统承受范围",

    "💘 匹配成功！<br><br>对方看了你照片后已退出聊天室",

    "🎮 今日CP已生成：<br><br>王者荣耀人机队友",

    "🐷 检测完成：<br><br>你的恋爱脑含量为0",

    "📦 520礼包已到账：<br><br>孤独、寂寞、冷",

    "😂 系统评价：<br><br>别人过520<br><br>你过星期二",

    "📞 你的专属对象正在来电...<br><br>备注名称：10086",

    "💋 恭喜获得：<br><br>《舔狗入门课程》永久VIP",

    "🪞 系统最终决定：<br><br>你还是继续照镜子吧",

    "🐔 今日恋爱建议：<br><br>少做梦，多搬砖",

    "🧠 AI分析结果：<br><br>你不是没人喜欢<br><br>是狗都嫌",

    "📢 系统公告：<br><br>由于你过于离谱<br><br>月老已辞职",

    "🎉 恭喜抽中隐藏大奖：<br><br>民政局一日游（单人票）",

    "💔 你的520对象：<br><br>隔壁桌情侣吃剩的狗粮",

    "📡 正在连接恋爱服务器...<br><br>连接超时",

    "😈 本系统郑重提醒：<br><br>你不是单身狗<br><br>你是单身藏獒",

    "🕯️ 系统为你点亮蜡烛：<br><br>祝你明年继续一个人"

  ];

  let random =
  texts[
  Math.floor(
  Math.random() * texts.length
  )
  ];

  box.style.display = "block";

  box.innerHTML = random;
}

</script>

</body>
</html>
